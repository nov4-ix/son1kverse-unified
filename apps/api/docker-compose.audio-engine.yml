# ─── SON1KVERSE — docker-compose.yml para Audio Engine GPU ───
#
# Despliegue en la nube con GPU:
#   docker-compose up --build
#
# Variables de entorno clave:
#   HEARTMULA_AUTO_DOWNLOAD=1   → Descarga checkpoints automáticamente (primer despliegue lento)
#   HEARTMULA_CKPT_DIR=/app/ckpt → Directorio de checkpoints (puedes montar un volumen)
#

services:
  audio-engine:
    build:
      context: ..
      dockerfile: son1kverse/Dockerfile.audio-engine
    image: son1kverse-audio-engine:latest
    container_name: son1kverse-audio-engine
    runtime: nvidia
    environment:
      - HEARTMULA_CKPT_DIR=/app/ckpt
      - HEARTMULA_VERSION=3B
      - HEARTMULA_AUTO_DOWNLOAD=1
      - HEARTMULA_LAZY_LOAD=1
      - HEARTMULA_MULA_DTYPE=bfloat16
      - HEARTMULA_CODEC_DTYPE=float32
      - AUDIO_ENGINE_HOST=0.0.0.0
      - AUDIO_ENGINE_PORT=8001
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ports:
      - "8001:8001"
    volumes:
      - ./audio_engine/ckpt:/app/ckpt        # Persistir checkpoints entre reinicios
      - ./audio_engine/outputs:/app/outputs  # Persistir WAVs generados
      - ./son1kverse/audio_engine:/app/audio_engine  # Código vivo para desarrollo
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # El modelo tarda en cargar (5-10 min en GPU)

volumes:
  ckpt-data:
  outputs-data:
