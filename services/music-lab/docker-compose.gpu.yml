services:
  music-lab:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: son1kverse-music-lab:gpu
    restart: unless-stopped
    environment:
      MUSIC_LAB_MODE: ace-step
      MUSIC_LAB_OUTPUT_DIR: /outputs
      MUSIC_LAB_MAX_CONCURRENCY: "1"
      MUSIC_LAB_API_KEY: ${MUSIC_LAB_API_KEY:?define MUSIC_LAB_API_KEY (obligatoria)}
      ACE_STEP_MODEL_PATH: /models/ace-step
      ACE_STEP_DEVICE: cuda
      ACE_STEP_DTYPE: ${ACE_STEP_DTYPE:-bfloat16}
      ACE_STEP_OFFLOAD: ${ACE_STEP_OFFLOAD:-true}
      ACE_STEP_USE_LM: ${ACE_STEP_USE_LM:-false}
      ACE_STEP_CONFIG_PATH: ${ACE_STEP_CONFIG_PATH:-acestep-v15-turbo}
    ports:
      - "127.0.0.1:8002:8002"   # no exponer a toda la red; usa un proxy TLS delante
    volumes:
      - ./models:/models:ro
      - ./outputs:/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
