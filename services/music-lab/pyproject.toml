[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "son1kverse-music-lab"
version = "0.1.0"
description = "SON1KVERSE Music Lab - CPU-first audio generation service"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "numpy>=1.24,<3",
  "soundfile>=0.12,<1",
  "scipy>=1.11,<2",
  "pytest>=8,<9",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF046"]
